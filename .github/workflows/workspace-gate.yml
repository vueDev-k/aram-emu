name: public workspace regression gate

on:
  workflow_call:
    inputs:
      product_sha:
        required: true
        type: string
      core_sha:
        required: true
        type: string
      frontend_sha:
        required: true
        type: string
      authd_sha:
        required: true
        type: string

permissions:
  contents: read

jobs:
  synthetic:
    # Public fork gate: core/frontend/integration tests only.
    # The upstream private aram-test compatibility corpus is NOT executed.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GOWORK: ${{ github.workspace }}/aram-emu/go.work
      ARAM_REFERENCE_REPO: ""
      ARAM_TEST_DATA: ""
      ARAM_CORE_ROOT: ""
    steps:
      - name: Require immutable component revisions
        shell: bash
        env:
          PRODUCT_SHA: ${{ inputs.product_sha }}
          CORE_SHA: ${{ inputs.core_sha }}
          FRONTEND_SHA: ${{ inputs.frontend_sha }}
          AUTHD_SHA: ${{ inputs.authd_sha }}
        run: |
          for revision in "${PRODUCT_SHA}" "${CORE_SHA}" "${FRONTEND_SHA}" \
              "${AUTHD_SHA}"; do
            [[ "${revision}" =~ ^[0-9a-f]{40}$ ]]
          done

      - name: Check out product
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.product_sha }}
          path: aram-emu
          persist-credentials: false

      - name: Check out core
        uses: actions/checkout@v6
        with:
          repository: mirusu400/aram-core
          ref: ${{ inputs.core_sha }}
          path: aram-core
          persist-credentials: false

      - name: Check out frontend
        uses: actions/checkout@v6
        with:
          repository: mirusu400/aram-frontend
          ref: ${{ inputs.frontend_sha }}
          path: aram-frontend
          persist-credentials: false

      - name: Check out authd
        uses: actions/checkout@v6
        with:
          repository: mirusu400/aram-authd
          ref: ${{ inputs.authd_sha }}
          path: aram-authd
          persist-credentials: false

      - uses: actions/setup-go@v6
        with:
          go-version-file: aram-emu/go.mod
          cache-dependency-path: |
            aram-emu/go.sum
            aram-emu/go.work.sum
            aram-core/go.sum
            aram-frontend/go.sum
            aram-authd/go.sum

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Linux desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libc6-dev libgl1-mesa-dev libxcursor-dev libxi-dev \
            libxinerama-dev libxrandr-dev libxxf86vm-dev \
            libasound2-dev pkg-config xvfb

      # Keep the ownership checks ordered, before the complete black-box authority.
      - name: Core tests and vet
        working-directory: aram-core
        run: |
          go test -count=1 ./...
          go vet ./...

      - name: Frontend tests and vet
        working-directory: aram-frontend
        run: |
          xvfb-run -a go test -count=1 ./...
          go vet ./...

      - name: Integration tests and vet
        working-directory: aram-emu
        run: |
          xvfb-run -a go test -count=1 ./...
          go vet ./...
          python -m unittest discover -s scripts -p 'test_*.py'

